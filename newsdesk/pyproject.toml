[project]
name = "newsdesk"
version = "0.1.0"
description = "AI news research log for a stock watchlist, with automatic scoring"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["newsdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
